<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专注待办 - 智能提醒</title>
    <style>
        :root {
            --bg-color: #f4f7f6; --card-bg: #ffffff; --text-main: #333333;
            --text-sub: #888888; --border-color: #e0e0e0; --primary-color: #4a90e2;
            --danger-color: #ff5252; --success-color: #4caf50;
            --shadow: 0 8px 24px rgba(0,0,0,0.08); --font-size-base: 16px;
        }
        body.dark-mode {
            --bg-color: #1a1a1a; --card-bg: #2d2d2d; --text-main: #e0e0e0;
            --text-sub: #aaaaaa; --border-color: #404040;
            --shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        * { box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 20px; display: flex; justify-content: center;
            font-size: var(--font-size-base);
        }
        .app-container {
            width: 100%; max-width: 600px; background: var(--card-bg);
            border-radius: 16px; padding: 30px; box-shadow: var(--shadow); height: fit-content; position: relative;
        }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 1.5em; }
        .settings-bar { display: flex; gap: 10px; align-items: center; }
        .icon-btn { background: none; border: none; cursor: pointer; font-size: 1.2em; padding: 5px; border-radius: 50%; color: var(--text-main); }
        .icon-btn:hover { background-color: var(--border-color); }
        .stats-panel { background: var(--bg-color); padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-around; text-align: center; }
        .stat-num { font-size: 1.4em; font-weight: bold; color: var(--primary-color); }
        .stat-label { font-size: 0.8em; color: var(--text-sub); margin-top: 4px; }
        .input-area { display: flex; flex-direction: column; gap: 10px; margin-bottom: 25px; }
        .row { display: flex; gap: 10px; }
        input, select { padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--card-bg); color: var(--text-main); outline: none; font-size: 0.9em; }
        input:focus { border-color: var(--primary-color); }
        #taskInput { flex: 1; }
        #addBtn { background: var(--primary-color); color: white; border: none; padding: 0 25px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { display: flex; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border-color); gap: 12px; }
        li.completed .task-text { text-decoration: line-through; color: var(--text-sub); opacity: 0.7; }
        .priority-tag { font-size: 0.7em; padding: 2px 8px; border-radius: 4px; color: white; font-weight: bold; white-space: nowrap; }
        .p-high { background: var(--danger-color); } .p-medium { background: #ff9800; } .p-low { background: var(--success-color); }
        .task-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .task-meta { font-size: 0.75em; color: var(--text-sub); display: flex; gap: 10px; }
        .action-btn { background: none; border: none; cursor: pointer; color: var(--text-sub); font-size: 1.1em; padding: 5px; }
        .action-btn:hover { color: var(--danger-color); }
        input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: var(--primary-color); }
        
        /* 遮罩层样式 */
        #audioUnlockOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 100; display: flex;
            justify-content: center; align-items: center; flex-direction: column;
            color: white; border-radius: 16px; backdrop-filter: blur(5px);
        }
        #unlockAudioBtn {
            padding: 12px 24px; font-size: 16px; background: var(--primary-color);
            color: white; border: none; border-radius: 8px; cursor: pointer;
            margin-top: 20px; font-weight: bold; box-shadow: 0 4px 10px rgba(74, 144, 226, 0.4);
        }
        #unlockAudioBtn:hover { transform: scale(1.05); }
        
        /* 底部提示文字 */
        .footer-tip {
            text-align: center; font-size: 0.75em; color: var(--text-sub); 
            margin-top: 20px; opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 声音解锁遮罩层 -->
    <div id="audioUnlockOverlay">
        <h2 style="margin-bottom: 10px;">🔔 需要您的授权</h2>
        <p style="color: #ccc; font-size: 0.9em;">为了准时提醒您，请点击下方按钮开启声音权限</p>
        <button id="unlockAudioBtn">✅ 开启闹钟提醒</button>
    </div>

    <header>
        <h1>📋 专注待办</h1>
        <div class="settings-bar">
            <button class="icon-btn" id="fontDown" title="缩小字体">A-</button>
            <button class="icon-btn" id="fontUp" title="放大字体">A+</button>
            <button class="icon-btn" id="themeToggle" title="切换日夜模式">🌙</button>
        </div>
    </header>

    <div class="stats-panel">
        <div><div class="stat-num" id="totalCount">0</div><div class="stat-label">总任务</div></div>
        <div><div class="stat-num" id="doneCount">0</div><div class="stat-label">已完成</div></div>
        <div><div class="stat-num" id="rateCount">0%</div><div class="stat-label">完成率</div></div>
    </div>

    <div class="input-area">
        <div class="row">
            <input type="text" id="taskInput" placeholder="输入新任务..." autofocus>
            <button id="addBtn">添加</button>
        </div>
        <div class="row">
            <select id="prioritySelect">
                <option value="medium">⏱ 普通优先</option>
                <option value="high">🔥 紧急重要</option>
                <option value="low">🍃 稍后处理</option>
            </select>
            <input type="datetime-local" id="reminderTime" style="flex:1;">
        </div>
    </div>

    <ul id="todoList"></ul>
    
    <div class="footer-tip">💡 保持此标签页在前台可获得最佳提醒效果</div>
</div>

<script>
    // ================= 1. 状态管理 =================
    const STATE_KEY = 'focus_todo_v3';
    let todos = JSON.parse(localStorage.getItem(STATE_KEY)) || [];
    let fontSize = parseInt(localStorage.getItem('font_size')) || 16;
    let isDark = localStorage.getItem('theme') === 'dark';

    // DOM 元素获取
    const els = {
        list: document.getElementById('todoList'),
        input: document.getElementById('taskInput'),
        priority: document.getElementById('prioritySelect'),
        time: document.getElementById('reminderTime'),
        addBtn: document.getElementById('addBtn'),
        themeBtn: document.getElementById('themeToggle'),
        fontUp: document.getElementById('fontUp'),
        fontDown: document.getElementById('fontDown'),
        stats: { 
            total: document.getElementById('totalCount'), 
            done: document.getElementById('doneCount'), 
            rate: document.getElementById('rateCount') 
        },
        overlay: document.getElementById('audioUnlockOverlay'),
        unlockBtn: document.getElementById('unlockAudioBtn')
    };

    // ================= 2. Web Audio API 声音系统 =================
    let audioCtx; 

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playBeep() {
        if (!audioCtx) return;
        try {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'sine';
            oscillator.frequency.value = 880; 
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        } catch (e) {
            console.warn("音频播放被拦截:", e);
        }
    }

    // ================= 3. 核心渲染逻辑 =================
    function render() {
        els.list.innerHTML = '';
        const priorityOrder = { high: 0, medium: 1, low: 2 };
        const sorted = [...todos].sort((a, b) => {
            if (a.completed !== b.completed) return a.completed ? 1 : -1;
            if (priorityOrder[a.priority] !== priorityOrder[b.priority]) 
                return priorityOrder[a.priority] - priorityOrder[b.priority];
            return new Date(a.createdAt) - new Date(b.createdAt);
        });

        sorted.forEach(todo => {
            const li = document.createElement('li');
            if (todo.completed) li.classList.add('completed');
            const pLabel = { high: '紧急', medium: '普通', low: '低优' }[todo.priority];
            const timeStr = todo.reminder ? `⏰ ${new Date(todo.reminder).toLocaleString('zh-CN', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}` : '';
            
            li.innerHTML = `
                <input type="checkbox" ${todo.completed ? 'checked' : ''} data-id="${todo.id}">
                <span class="priority-tag p-${todo.priority}">${pLabel}</span>
                <div class="task-info">
                    <span class="task-text">${escapeHtml(todo.text)}</span>
                    <div class="task-meta"><span>${timeStr}</span></div>
                </div>
                <button class="action-btn delete-btn" data-id="${todo.id}" title="删除">🗑️</button>
            `;
            els.list.appendChild(li);
        });
        updateStats();
        save();
    }

    function updateStats() {
        const total = todos.length;
        const done = todos.filter(t => t.completed).length;
        const rate = total === 0 ? 0 : Math.round((done / total) * 100);
        els.stats.total.textContent = total;
        els.stats.done.textContent = done;
        els.stats.rate.textContent = rate + '%';
    }

    function save() { localStorage.setItem(STATE_KEY, JSON.stringify(todos)); }
    function escapeHtml(text) {
        const div = document.createElement('div'); div.textContent = text; return div.innerHTML;
    }

    // ================= 4. 事件绑定 =================
    els.addBtn.addEventListener('click', () => {
        const text = els.input.value.trim();
        if (!text) return els.input.focus();
        todos.push({
            id: Date.now(), text, priority: els.priority.value,
            reminder: els.time.value || null, completed: false,
            createdAt: new Date().toISOString(), notified: false
        });
        els.input.value = ''; els.time.value = ''; render();
    });

    els.list.addEventListener('click', (e) => {
        const id = Number(e.target.dataset.id);
        if (!id) return;
        if (e.target.type === 'checkbox') {
            const todo = todos.find(t => t.id === id);
            if (todo) todo.completed = e.target.checked;
            render();
        } else if (e.target.classList.contains('delete-btn')) {
            if (confirm('确定删除这条任务吗？')) {
                todos = todos.filter(t => t.id !== id);
                render();
            }
        }
    });

    function applyTheme() {
        document.body.classList.toggle('dark-mode', isDark);
        els.themeBtn.textContent = isDark ? '☀️' : '🌙';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }
    els.themeBtn.addEventListener('click', () => { isDark = !isDark; applyTheme(); });

    function applyFontSize() {
        fontSize = Math.max(12, Math.min(24, fontSize));
        document.documentElement.style.setProperty('--font-size-base', fontSize + 'px');
        localStorage.setItem('font_size', fontSize);
    }
    els.fontUp.addEventListener('click', () => { fontSize += 2; applyFontSize(); });
    els.fontDown.addEventListener('click', () => { fontSize -= 2; applyFontSize(); });

    // ================= 5. 闹钟提醒系统 (后台优化版) =================
    async function requestNotificationPermission() {
        if ('Notification' in window && Notification.permission === 'default') {
            await Notification.requestPermission();
        }
    }

    function checkReminders() {
        const now = new Date();
        todos.forEach(todo => {
            if (!todo.completed && !todo.notified && todo.reminder) {
                const reminderTime = new Date(todo.reminder);
                // 允许30秒误差窗口
                if (now >= reminderTime && now - reminderTime < 30000) {
                    triggerAlarm(todo);
                    todo.notified = true;
                    save();
                }
            }
        });
    }

    function triggerAlarm(todo) {
        const isPageVisible = document.visibilityState === 'visible';
        
        // 1. 如果页面在前台，正常播放自定义声音
        if (isPageVisible) {
            playBeep();
            setTimeout(playBeep, 600);
        }
        
        // 2. 无论前后台，都发送系统通知（自带提示音，不受后台限制）
        if ('Notification' in window && Notification.permission === 'granted') {
            new Notification('⏰ 待办提醒', {
                body: todo.text,
                icon: '📋',
                tag: todo.id.toString(),
                silent: false,           // 使用系统通知自带的提示音
                requireInteraction: true // 通知不会自动消失，必须手动点击
            });
        } else if (!isPageVisible) {
            // 3. 如果没通知权限且页面在后台，记录日志
            console.warn('页面在后台且无通知权限，声音可能被浏览器拦截');
        } else {
            // 4. 前台但没有通知权限，降级为 alert
            alert(`⏰ 提醒：${todo.text}`);
        }
    }

    setInterval(checkReminders, 10000);

    // ================= 6. 声音解锁逻辑 =================
    if (sessionStorage.getItem('audioUnlocked')) {
        els.overlay.style.display = 'none';
    }

    els.unlockBtn.addEventListener('click', function() {
        try {
            initAudio(); 
            playBeep();  
            els.overlay.style.display = 'none';
            sessionStorage.setItem('audioUnlocked', 'true');
        } catch (e) {
            console.error("初始化失败", e);
            alert("浏览器不支持 Web Audio API，请更换 Chrome 或 Edge 浏览器");
        }
    });

    // ================= 7. 初始化 =================
    applyTheme();
    applyFontSize();
    requestNotificationPermission();
    render();
</script>
</body>
</html>
